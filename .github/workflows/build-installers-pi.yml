name: Build Installer (Raspberry Pi 5 ARM64)

# on:
#   workflow_dispatch:
on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "pom.xml"
      - "scripts/**"
      - ".github/workflows/build-installers-pi.yml"

  workflow_dispatch:

env:
  PROJECT_PATH: .
  APP_VERSION: 1.0.0

jobs:
  build-arm64:
    name: Build Raspberry Pi 5 ARM64 DEB
    runs-on: ubuntu-22.04-arm

    steps:

      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          architecture: aarch64
          cache: maven

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-0 \
            libfreetype6 \
            libgl1-mesa-dri \
            libasound2 \
            libwebkit2gtk-4.1-0 \
            libpcsclite1

      - name: Build JAR + Runtime
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          chmod +x mvnw || true
          
          echo "🚀 Building project...."
          ./mvnw -B -DskipTests -Djavafx.platform=linux clean package
          
          echo "📦 Target contents:"
          ls -lh target
          
          JAR_NAME=$(ls target/Scamusica-*.jar | grep -v original | head -1 | xargs -r basename)
          
          if [ -z "$JAR_NAME" ]; then
            echo "❌ JAR not found!"
            exit 1
          fi
          
          echo "✅ Using JAR: $JAR_NAME"
          echo "JAR_NAME=$JAR_NAME" >> $GITHUB_ENV
          
          rm -rf target/scamusica-runtime
          
          JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))
          JFX_PATH="./openjfx-21_linux-aarch64_bin-sdk/javafx-sdk-21/lib"
          
          if [ ! -d "$JFX_PATH" ]; then
            echo "❌ JavaFX SDK not found!"
            exit 1
          fi
          
          echo "📦 Creating runtime..."
          jlink \
            --module-path "$JAVA_HOME/jmods:$JFX_PATH" \
            --add-modules javafx.controls,javafx.fxml,javafx.media,javafx.graphics,javafx.base,java.desktop,java.logging,java.net.http,jdk.crypto.ec \
            --output target/scamusica-runtime \
            --strip-debug \
            --no-man-pages \
            --no-header-files \
            --compress=2
          
          cp $JFX_PATH/*.so target/scamusica-runtime/lib/
          
          echo "🔎 Verify runtime:"
          find target/scamusica-runtime -name "libprism*"

      - name: Import SSL certificates
        run: |
          KEYTOOL=target/scamusica-runtime/bin/keytool
          CACERTS=target/scamusica-runtime/lib/security/cacerts
          STOREPASS=changeit
          
          echo "🧹 Cleaning old certs..."
          $KEYTOOL -delete -alias cis-root -keystore $CACERTS -storepass $STOREPASS || true
          $KEYTOOL -delete -alias new-cert-1 -keystore $CACERTS -storepass $STOREPASS || true
          $KEYTOOL -delete -alias new-cert-2 -keystore $CACERTS -storepass $STOREPASS || true
          
          echo "📥 Importing certs..."
          $KEYTOOL -importcert -alias cis-root \
            -file "certs/ca 9.crt" \
            -keystore $CACERTS -storepass $STOREPASS -noprompt
          
          $KEYTOOL -importcert -alias new-cert-1 \
            -file "certs/ca-10.crt" \
            -keystore $CACERTS -storepass $STOREPASS -noprompt
          
          $KEYTOOL -importcert -alias new-cert-2 \
            -file "certs/Fortinet_CA_SSLProxy_new-7.cer" \
            -keystore $CACERTS -storepass $STOREPASS -noprompt
          
          echo "✅ Certificates imported"

      - name: Verify certificates
        run: |
          keytool -list \
            -keystore target/scamusica-runtime/lib/security/cacerts \
            -storepass changeit | grep -E "cis-root|new-cert-1|new-cert-2"

      - name: Install VLC
        run: |
          sudo apt-get update
          sudo apt-get install -y vlc

      - name: Prepare jpackage input
        run: |
          mkdir -p target/jpackage-input
          
          cp target/$JAR_NAME target/jpackage-input/
          
          # ✅ Copy restart script
          cp scripts/restart_scamusica.sh target/jpackage-input/ || echo "⚠️ restart script not found"
          
          # ✅ Copy wrapper script (NEW)
          cp scripts/scamusica_wrapper.sh target/jpackage-input/ || echo "⚠️ wrapper script not found"
          
          echo "📦 jpackage-input contents:"
          ls -lh target/jpackage-input/



      - name: Package into DEB
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          echo "📦 Input folder:"
          ls -lh target/jpackage-input
          
          echo "📦 Creating DEB..."
          
          jpackage \
            --type deb \
            --dest target \
            --name Scamusica \
            --input target/jpackage-input \
            --main-jar "$JAR_NAME" \
            --main-class com.musicplayer.scamusica.Main \
            --runtime-image target/scamusica-runtime \
            --icon linux/icons/scamusica.png \
            --linux-shortcut \
            --linux-menu-group Audio \
            --linux-package-deps "libgtk-3-0,libglib2.0-0,libasound2,libpng16-16,libjpeg62-turbo,libpcre2-8-0,libx11-6,libxext6,libxrender1,libxtst6,libxi6,vlc" \
            --java-options "-Xmx512m -Xms256m -XX:+UseG1GC -XX:MaxHeapFreeRatio=30 -XX:MinHeapFreeRatio=10" \
            --verbose

      # ✅ Ingest Autostart & Upgrade Cleanup Control Scripts into DEB
      - name: Fix scripts and configure autostart in DEB
        run: |
          DEB_FILE=$(ls target/*.deb | head -1)
          mkdir -p target/deb-extract
          dpkg-deb -R "$DEB_FILE" target/deb-extract
          
          mkdir -p target/deb-extract/opt/scamusica/lib/app
          mkdir -p target/deb-extract/etc/xdg/autostart
          mkdir -p target/deb-extract/DEBIAN
          
          # Copy scripts
          cp scripts/restart_scamusica.sh target/deb-extract/opt/scamusica/lib/app/
          cp scripts/scamusica_wrapper.sh target/deb-extract/opt/scamusica/lib/app/
          chmod +x target/deb-extract/opt/scamusica/lib/app/*.sh
          
          # Create system-wide desktop autostart file
          cat << 'EOF' | sed 's/^[ \t]*//' > target/deb-extract/etc/xdg/autostart/scamusica.desktop
          [Desktop Entry]
          Type=Application
          Name=Scamusica
          Comment=Scamusica Music Player Auto Launcher
          Exec=/opt/scamusica/lib/app/scamusica_wrapper.sh
          Terminal=false
          X-GNOME-Autostart-enabled=true
          EOF
          chmod 644 target/deb-extract/etc/xdg/autostart/scamusica.desktop

          # Fix the jpackage generated main desktop file to use the wrapper script and valid categories
          find target/deb-extract -name "scamusica-Scamusica.desktop" -type f | while read df; do
              sed -i 's|^Exec=.*|Exec=/opt/scamusica/lib/app/scamusica_wrapper.sh|g' "$df"
              sed -i 's|^Categories=.*|Categories=AudioVideo;Audio;Player;|g' "$df"
          done

          # Manually place the desktop file in /usr/share/applications so the OS detects it automatically
          mkdir -p target/deb-extract/usr/share/applications
          find target/deb-extract -name "scamusica-Scamusica.desktop" -type f -exec cp {} target/deb-extract/usr/share/applications/ \;

          # Create DEBIAN/preinst (runs before package upgrade/install to stop old process & clean stale files)
          cat << 'EOF' | sed 's/^[ \t]*//' > target/deb-extract/DEBIAN/preinst
          #!/bin/bash
          set -e

          echo "🔄 [Scamusica] Pre-install cleanup: Stopping existing instances..."
          pkill -9 -f "com.musicplayer.scamusica.Main" 2>/dev/null || true
          pkill -9 -f "scamusica_wrapper.sh" 2>/dev/null || true
          pkill -9 -f "restart_scamusica.sh" 2>/dev/null || true

          systemctl --user stop scamusica.service 2>/dev/null || true

          exit 0
          EOF
          chmod 755 target/deb-extract/DEBIAN/preinst

          # Create DEBIAN/postinst (runs after installation to set permissions)
          cat << 'EOF' | sed 's/^[ \t]*//' > target/deb-extract/DEBIAN/postinst
          #!/bin/bash
          set -e

          echo "⚙️ [Scamusica] Post-install setup..."
          chmod +x /opt/scamusica/lib/app/*.sh 2>/dev/null || true
          if [ -f /etc/xdg/autostart/scamusica.desktop ]; then
              chmod 644 /etc/xdg/autostart/scamusica.desktop
          fi

          echo "🖥️ [Scamusica] Registering desktop shortcut..."
          if command -v xdg-desktop-menu >/dev/null 2>&1; then
              xdg-desktop-menu install --novendor /opt/scamusica/lib/scamusica-Scamusica.desktop 2>/dev/null || true
          fi

          echo "🖥️ [Scamusica] Placing shortcut on user desktops..."
          for user_home in /home/*; do
              if [ -d "$user_home/Desktop" ]; then
                  cp /usr/share/applications/scamusica-Scamusica.desktop "$user_home/Desktop/scamusica.desktop"
                  chown $(stat -c '%U:%G' "$user_home") "$user_home/Desktop/scamusica.desktop"
                  chmod +x "$user_home/Desktop/scamusica.desktop"
              fi
          done

          echo "✅ [Scamusica] Installation & system autostart configured successfully."
          exit 0
          EOF
          chmod 755 target/deb-extract/DEBIAN/postinst

          # Create DEBIAN/prerm (runs before removal)
          cat << 'EOF' | sed 's/^[ \t]*//' > target/deb-extract/DEBIAN/prerm
          #!/bin/bash
          set -e

          echo "🧹 [Scamusica] Pre-removal: Stopping running player processes..."
          pkill -9 -f "com.musicplayer.scamusica.Main" 2>/dev/null || true
          pkill -9 -f "scamusica_wrapper.sh" 2>/dev/null || true

          echo "🖥️ [Scamusica] Unregistering desktop shortcut..."
          if command -v xdg-desktop-menu >/dev/null 2>&1; then
              xdg-desktop-menu uninstall /opt/scamusica/lib/scamusica-Scamusica.desktop 2>/dev/null || true
          fi

          echo "🧹 [Scamusica] Removing shortcut from user desktops..."
          for user_home in /home/*; do
              if [ -f "$user_home/Desktop/scamusica.desktop" ]; then
                  rm -f "$user_home/Desktop/scamusica.desktop"
              fi
          done

          exit 0
          EOF
          chmod 755 target/deb-extract/DEBIAN/prerm

          # Rebuild DEB package with automated scripts and autostart configuration
          dpkg-deb -b target/deb-extract "$DEB_FILE"

      - name: Verify package architecture
        run: |
          dpkg-deb --info target/*.deb | grep Architecture

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: scamusica-rpi5-arm64
          path: target/*.deb
          retention-days: 30